<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FitOS test bench</title><link rel="stylesheet" href="styles.css"></head>
<body><main><div class="section-head"><div><p class="eyebrow">DEVELOPMENT</p><h2>FitOS test bench</h2></div></div><div class="panel"><p class="muted">Runs calculation, food-database and local-storage checks in the browser.</p><button id="run" class="primary">Run tests</button><div id="results" aria-live="polite"></div></div></main>
<script src="foods.js"></script><script src="db.js"></script><script src="app.js"></script><script>
const escapeHtml=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
document.getElementById("run").onclick=async()=>{const out=[];const test=async(name,fn)=>{try{await fn();out.push({pass:true,text:"PASS — "+name})}catch(e){out.push({pass:false,text:"FAIL — "+name+": "+e.message})}};const assert=(x,m)=>{if(!x)throw Error(m)};
await test("200 g cooked rice doubles per-100 g calories",()=>{const f=AOS_FOODS.find(x=>x.id==="rice_white_cooked");assert(Math.abs(AOS_TEST.scaled(f,200).kcal-260)<.001,"expected 260 kcal")});
await test("cooked chicken protein reference calculation",()=>{const f=AOS_FOODS.find(x=>x.id==="chicken_breast_cooked");assert(Math.abs(AOS_TEST.scaled(f,100).protein-31)<.001,"expected 31 g protein")});
await test("food dataset contains more than 100 foods",()=>{assert(AOS_TEST.allFoods().length>=120,"food list too small: "+AOS_TEST.allFoods().length)});
await test("Tamil alias search finds cooked rice",()=>{assert(AOS_TEST.findFood("சாதம்")[0]?.id==="rice_white_cooked","Tamil alias not matched")});
await test("raw and cooked red rice are kept separate",()=>{assert(AOS_TEST.findFood("raw red rice")[0]?.id==="rice_red_raw","raw red rice mismatch");assert(AOS_TEST.findFood("cooked red rice")[0]?.id==="rice_red_cooked","cooked red rice mismatch")});
await test("parser flags ambiguous quantity without units",()=>{const r=AOS_TEST.parseNatural("2 rice");assert(r.length===1&&r[0].food===null,"ambiguous count silently matched")});
await test("parser recognises multiple foods and explicit grams",()=>{const r=AOS_TEST.parseNatural("2 boiled eggs, 200 g cooked rice, 150 g cooked chicken breast");assert(r.length===3&&r[0].food?.id==="egg_whole_boiled"&&r[0].grams===100&&r[1].food?.id==="rice_white_cooked"&&r[1].grams===200&&r[2].food?.id==="chicken_breast_cooked"&&r[2].grams===150,"one or more items did not parse")});
await test("casual sentence parses number words and multiple foods",()=>{const r=AOS_TEST.parseNatural("I ate 3 idlis, 2 eggs, 200 g cooked chicken breast and one banana for breakfast");assert(r.length===4&&r[0].food?.id==="idli_plain"&&r[0].grams===150&&r[1].food?.id==="egg_whole_boiled"&&r[1].grams===100&&r[2].food?.id==="chicken_breast_cooked"&&r[2].grams===200&&r[3].food?.id==="banana_raw"&&r[3].grams===118,"casual entry parsing failed")});
await test("ambiguous raw/cooked chicken is held for confirmation",()=>{const r=AOS_TEST.parseNatural("200 g chicken breast");assert(r.length===1&&r[0].food===null&&r[0].grams===200,"raw/cooked state was guessed")});
await test("cup and tablespoon quantities are parsed as estimates",()=>{const r=AOS_TEST.parseNatural("2 cups cooked rice and 1 tbsp oil");assert(r.length===2&&r[0].grams===480&&r[1].grams===15,"volume units not parsed")});
await test("database upgrade exposes custom food and saved meal stores",async()=>{await AOS_DB.openDB();const backup=await AOS_DB.exportAll();assert(Array.isArray(backup.customFoods)&&Array.isArray(backup.savedMeals)&&Array.isArray(backup.supplementLogs)&&backup.schemaVersion===3,"new stores missing from backup")});
await test("custom foods can be saved and read locally",async()=>{const row={id:"__fitos_test_custom__",name:"Temporary test food",kcal:1,protein:0,carbs:0,fat:0,fiber:0};await AOS_DB.put("customFoods",row);const result=await AOS_DB.get("customFoods",row.id);assert(result?.name===row.name,"custom food failed round-trip");await AOS_DB.remove("customFoods",row.id)});
await test("saved meals can be saved and read locally",async()=>{const row={id:"__fitos_test_meal__",name:"Temporary test meal",items:[],createdAt:Date.now()};await AOS_DB.put("savedMeals",row);const result=await AOS_DB.get("savedMeals",row.id);assert(result?.name===row.name,"saved meal failed round-trip");await AOS_DB.remove("savedMeals",row.id)});

await test("supplement logs store is available",async()=>{const row={id:"__fitos_test_supplement__",date:"2000-01-01",name:"Temporary test",dose:1,unit:"mg"};await AOS_DB.put("supplementLogs",row);const result=await AOS_DB.get("supplementLogs",row.id);assert(result?.name===row.name,"supplement log failed round-trip");await AOS_DB.remove("supplementLogs",row.id)});
await test("legacy Aesthetic OS backup format is accepted",async()=>{const result=await AOS_DB.restoreAll({app:"Aesthetic OS",schemaVersion:1,settings:[],foodLogs:[],measurements:[],workouts:[],recovery:[]},"merge");assert(result.legacy===true,"legacy format not identified")});
document.getElementById("results").innerHTML=out.map(x=>`<p style="color:${x.pass?'#e6e6e8':'#ff9d90'}">${escapeHtml(x.text)}</p>`).join("")+`<p><strong>${out.filter(x=>x.pass).length}/${out.length} passed</strong></p>`;};
if(new URLSearchParams(location.search).has("autorun")) document.getElementById("run").click();
</script></body></html>
